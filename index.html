<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e0f2fe" />
  <title>신나는 블루투스 RC카 조종기 🏎️</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">READY TO ROLL!</p>
        <h1>달려라! RC카<br><em>제주여고 로봇동아리</em></h1>
      </div>
      <div class="hero-right">
        <div class="car-art" aria-label="RC카 일러스트" role="img">
          <div class="signal signal-a"></div><div class="signal signal-b"></div>
          <div class="car-body">
            <span class="car-window"></span>
            <span class="car-light"></span>
            <span class="car-smile"></span>
          </div>
          <span class="wheel wheel-left"></span><span class="wheel wheel-right"></span>
        </div>
        <button class="icon-button" id="helpButton" aria-label="도움말">?</button>
      </div>
    </section>

    <section class="connection-card">
      <div class="connection-copy">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <p class="label">RC카 연결 상태</p>
          <p class="connection-state" id="connectionState">연결 안 됨</p>
        </div>
      </div>
      <button class="connect-button" id="connectButton">연결하기 🔌</button>
    </section>

    <section class="control-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">COMMAND CENTER</p>
          <h2>방향 조종 패드 🎮</h2>
        </div>
        <span class="command-readout" id="commandReadout">대기 중 / 정지</span>
      </div>
      <div class="controller" aria-label="RC카 방향 조작">
        <button class="control-button up" data-command="1" aria-label="전진"><span>▲</span><small>전진</small></button>
        <button class="control-button linetrace" type="button" aria-label="라인트레이싱" title="라인트레이싱">
          <span class="icon-line">〰️</span>
          <small>라인트레이싱</small>
        </button>
        <button class="control-button left" data-command="3" aria-label="좌회전"><span>◀</span><small>좌회전</small></button>
        <button class="control-button stop" data-command="5" aria-label="정지"><span>■</span><small>정지</small></button>
        <button class="control-button right" data-command="4" aria-label="우회전"><span>▶</span><small>우회전</small></button>
        <button class="control-button down" data-command="2" aria-label="후진"><span>▼</span><small>후진</small></button>
      </div>
      <div class="browser-guide">
        <p>- 안드로이드 폰은 크롬(Chrome)</p>
        <p>- 아이폰은 블루파이(Bluefy)</p>
      </div>
    </section>

    <footer>
      <span>HM-10 READY</span>
      <span>9600 BAUD</span>
      <span id="transportLabel">연결 대기중</span>
    </footer>
  </main>
  
  <dialog id="helpDialog">
    <button class="dialog-close" id="closeHelp">×</button>
    <p class="eyebrow">HELP</p>
    <h2>이렇게 해보세요!</h2>
    <p>1. 스마트폰이나 컴퓨터의 블루투스를 켜세요.</p>
    <p>2. <strong>연결하기</strong> 버튼을 누르고 <strong>HM-10</strong> 또는 블루투스 모듈을 골라주세요.</p>
    <p>3. 방향 버튼을 누르고 있는 동안 움직이고, 손을 떼면 자동으로 멈춥니다!</p>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
