<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e0f2fe" />
  <title>신나는 블루투스 RC카 조종기 🏎️</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">⚡</span><span>블루투스 <span class="brand-highlight">RC카</span></span></div>
      <button class="icon-button" id="helpButton" aria-label="도움말">?</button>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">READY TO ROLL!</p>
        <h1>달려라!<br><em>RC카 🏎️</em></h1>
      </div>
      <div class="car-art" aria-label="RC카 일러스트" role="img">
        <div class="signal signal-a"></div><div class="signal signal-b"></div>
        <div class="car-body">
          <span class="car-window"></span>
          <span class="car-light"></span>
          <span class="car-smile"></span>
        </div>
        <span class="wheel wheel-left"></span><span class="wheel wheel-right"></span>
      </div>
    </section>

    <section class="connection-card">
      <div class="connection-copy">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <p class="label">RC카 연결 상태</p>
          <p class="connection-state" id="connectionState">연결 안 됨</p>
        </div>
      </div>
      <button class="connect-button" id="connectButton">연결하기 🔌</button>
    </section>

    <section class="control-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">COMMAND CENTER</p>
          <h2>방향 조종 패드 🎮</h2>
        </div>
        <span class="command-readout" id="commandReadout">대기 중 / S</span>
      </div>
      <div class="controller" aria-label="RC카 방향 조작">
        <button class="control-button up" data-command="F" aria-label="전진"><span>▲</span><small>앞으로</small></button>
        <button class="control-button left" data-command="L" aria-label="좌회전"><span>◀</span><small>왼쪽</small></button>
        <button class="control-button stop" data-command="S" aria-label="정지"><span>■</span><small>멈춤</small></button>
        <button class="control-button right" data-command="R" aria-label="우회전"><span>▶</span><small>오른쪽</small></button>
        <button class="control-button down" data-command="B" aria-label="후진"><span>▼</span><small>뒤로</small></button>
      </div>
      <p class="hint"><span>!</span> 버튼을 누르고 있는 동안만 움직이고, 떼면 멈춰요!</p>
    </section>

    <footer>
      <span>HC-06 READY</span>
      <span>9600 BAUD</span>
      <span id="transportLabel">연결 대기중</span>
    </footer>
  </main>
  
  <dialog id="helpDialog">
    <button class="dialog-close" id="closeHelp">×</button>
    <p class="eyebrow">HELP</p>
    <h2>이렇게 해보세요!</h2>
    <p>1. 스마트폰이나 컴퓨터의 블루투스를 켜세요.</p>
    <p>2. <strong>연결하기</strong> 버튼을 누르고 <strong>HC-06</strong> 또는 블루투스 모듈을 골라주세요.</p>
    <p>3. 연결이 되면 조종 패드 버튼을 꾹 누르고 주행해보세요!</p>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
